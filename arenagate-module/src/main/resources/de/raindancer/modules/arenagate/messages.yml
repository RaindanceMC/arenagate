# Rain's Arena Gate: every line this module says. Offered as a floor: an owner's own messages.yml wins.
arenagate:
  only-a-player: "<red>Only a player can go to the arena."
  not-allowed: "<red>You may not go to the arena."
  already-going: "<yellow>You are already on your way somewhere."
  counting: "<gray>Going to the arena in <white><seconds></white>. <dark_gray>(stand still)"
  cancelled-moved: "<yellow>You moved, so you stay here."
  cancelled-hurt: "<yellow>You were hurt, so you stay here. Finish the fight first."
  unreachable: "<red>The arena cannot be reached. Try again in a moment."
  sending: "<gray>Connecting to the arena. Your inventory stays on this server."
  summoned: "<gold>Your fight in the arena is ready. Taking you there."
  went: "<gray><white><player></white> went to the arena."
  back: "<gray><white><player></white> is back from the arena."

  duel:
    usage: "<gray>/duel invite <player> [duel|sumo|naval|mounted|horse|waves] [kit|own] [stake] [bo3]  ·  /duel accept  ·  /duel deny  ·  /duel queue [mode] [kit] [stake]"
    only-duels: "<red>Invites work for duel, sumo, naval, mounted, horse and waves. Teams and free for all come from the queue."

  invite:
    self: "<red>You cannot fight yourself."
    already: "<yellow>You have already asked <white><player></white>."
    unknown: "<red><white><player></white> is not online here or in the arena."
    elsewhere: "<red><white><player></white> is on <white><server></white>. Duel invites only reach players here or in the arena."
    sent: "<green>Asked <white><player></white>. They have a minute to answer. <click:run_command:'/duel cancel <id>'><red>[Cancel]</red></click>"
    sent-arena: "<green>Asked <white><player></white> in the arena. If they say yes, you are taken there. <click:run_command:'/duel cancel <id>'><red>[Cancel]</red></click>"
    received: "<gold><white><player></white> (<where>) asks you to a <white><mode></white> with <white><kit></white>, best of <white><rounds></white>, stake <white><stake></white>. <click:run_command:'/duel accept <id>'><green>[Accept]</green></click> <click:run_command:'/duel deny <id>'><red>[Decline]</red></click>"
    received-waves: "<gold><white><player></white> (<where>) asks you to fight mob waves together with <white><kit></white>. <click:run_command:'/duel accept <id>'><green>[Accept]</green></click> <click:run_command:'/duel deny <id>'><red>[Decline]</red></click>"
    accepted: "<green><white><player></white> accepted. Going to the arena."
    declined: "<yellow><white><player></white> declined."
    you-declined: "<gray>You declined <white><player></white>."
    gone: "<red>That invite no longer exists."
    you-cancelled: "<gray>You took your invite back."
    cancelled: "<yellow><white><player></white> took their invite back."
    nothing-to-cancel: "<gray>You have no open invite to take back."
    none: "<gray>Nobody has invited you to a fight."
    which: "<yellow>More than one invite is open. Click the one you mean, or type /duel accept <id>."
